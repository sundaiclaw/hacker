name: CI — Validate workflows, scripts & config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Fabro workflow validation ──────────────────────────────────────
  validate-workflows:
    name: Validate Fabro workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .fabro files contain valid DOT graph syntax
        run: |
          status=0
          for f in fabro/workflows/*/workflow.fabro; do
            if [ ! -f "$f" ]; then
              echo "No .fabro files found"
              exit 0
            fi
            if ! grep -q 'digraph' "$f"; then
              echo "FAIL: $f does not contain a 'digraph' declaration"
              status=1
            else
              echo "OK: $f"
            fi
          done
          exit $status

      - name: Validate workflow TOML files
        run: |
          status=0
          for f in fabro/workflows/*/workflow.toml; do
            if [ ! -f "$f" ]; then
              echo "No workflow.toml files found"
              exit 0
            fi
            if python3 -c "import tomllib; tomllib.load(open('$f','rb'))" 2>/dev/null; then
              echo "OK: $f"
            elif python3 -c "import toml; toml.load('$f')" 2>/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f is not valid TOML"
              status=1
            fi
          done
          exit $status

      - name: Verify referenced scripts exist
        run: |
          status=0
          for workflow_dir in fabro/workflows/*/; do
            fabro_file="${workflow_dir}workflow.fabro"
            [ -f "$fabro_file" ] || continue

            # Extract script= references from .fabro files
            grep -oP 'script="[^"]*"' "$fabro_file" 2>/dev/null | while read -r line; do
              # Pull out paths that look like bash <path>.sh
              script_path=$(echo "$line" | grep -oP 'bash \K[^ ]+\.sh' || true)
              if [ -n "$script_path" ] && [ ! -f "$script_path" ]; then
                echo "FAIL: $fabro_file references $script_path but it does not exist"
                # Signal failure via a marker file (subshell can't set parent vars)
                touch /tmp/ci_script_ref_fail
              fi
            done

            # Also check @prompts/ references
            grep -oP '@prompts/[^ "]+' "$fabro_file" 2>/dev/null | while read -r ref; do
              ref_path="${workflow_dir}${ref#@}"
              if [ ! -f "$ref_path" ]; then
                echo "FAIL: $fabro_file references $ref but $ref_path does not exist"
                touch /tmp/ci_script_ref_fail
              else
                echo "OK: $ref_path"
              fi
            done
          done

          if [ -f /tmp/ci_script_ref_fail ]; then
            exit 1
          fi
          echo "All script references valid"

  # ── 2. ShellCheck — lint shell scripts ────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on deploy/ and fabro scripts
        run: |
          # Collect all .sh files from deploy/ and fabro workflow scripts
          files=()
          for f in deploy/*.sh fabro/workflows/*/scripts/*.sh; do
            [ -f "$f" ] && files+=("$f")
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found to check"
            exit 0
          fi

          echo "Checking ${#files[@]} shell scripts..."
          shellcheck --severity=warning "${files[@]}"

  # ── 3. Validate .env.example completeness ─────────────────────────────
  validate-env:
    name: Validate .env.example completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for env var references not in .env.example
        run: |
          if [ ! -f .env.example ]; then
            echo "No .env.example found, skipping"
            exit 0
          fi

          # Extract variable names from .env.example
          declared_vars=$(grep -oP '^[A-Z_][A-Z0-9_]*(?==)' .env.example | sort -u)

          # Search shell scripts and markdown files for env var references
          # Look for patterns like $VAR, ${VAR}, $ENV_VAR in .sh and .md files
          referenced_vars=$(
            grep -rhoP '\$\{?([A-Z_][A-Z0-9_]*)\}?' \
              deploy/ fabro/ skills/ \
              --include='*.sh' --include='*.md' 2>/dev/null \
            | grep -oP '[A-Z_][A-Z0-9_]+' \
            | sort -u
          )

          # Filter to likely project-specific vars (exclude common shell/system vars)
          system_vars="PATH HOME USER SHELL TERM PWD OLDPWD HOSTNAME LANG LC_ALL EUID UID BASH_SOURCE BASH_LINENO FUNCNAME LINENO PIPESTATUS RANDOM SECONDS SHLVL IFS OSTYPE MACHTYPE HOSTTYPE REPLY GROUPS DIRSTACK MAPFILE READLINE_LINE READLINE_POINT COMP_WORDS COMP_CWORD COMP_LINE COMP_POINT COMP_TYPE COMP_KEY COMP_WORDBREAKS COPROC BASHPID BASH_ALIASES BASH_ARGC BASH_ARGV BASH_CMDS BASH_COMMAND BASH_COMPAT BASH_ENV BASH_EXECUTION_STRING BASH_LOADABLES_PATH BASH_REMATCH BASH_SUBSHELL BASH_VERSINFO BASH_VERSION BASHOPTS SHELLOPTS"

          missing=()
          for var in $referenced_vars; do
            # Skip system/shell built-in vars
            if echo "$system_vars" | grep -qw "$var"; then
              continue
            fi
            # Skip vars that are clearly local/loop vars (short names)
            if [ ${#var} -le 3 ]; then
              continue
            fi
            # Check if it's in .env.example
            if ! echo "$declared_vars" | grep -qw "$var"; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::The following env vars are referenced in code but not in .env.example:"
            printf '  %s\n' "${missing[@]}"
            echo ""
            echo "This is informational — some may be set by the system or runtime."
          else
            echo "All referenced env vars are declared in .env.example"
          fi

          # Always pass — this is advisory only
          exit 0

  # ── 4. Validate skill file structure ──────────────────────────────────
  validate-skills:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill directories have SKILL.md
        run: |
          status=0
          for dir in skills/*/; do
            [ -d "$dir" ] || continue
            skill_name=$(basename "$dir")
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "FAIL: skills/$skill_name/ is missing SKILL.md"
              status=1
            else
              echo "OK: skills/$skill_name/SKILL.md"
            fi
          done
          exit $status

      - name: Check references/ directories are not empty
        run: |
          status=0
          for ref_dir in skills/*/references/; do
            [ -d "$ref_dir" ] || continue
            skill_name=$(basename "$(dirname "$ref_dir")")
            file_count=$(find "$ref_dir" -type f | wc -l)
            if [ "$file_count" -eq 0 ]; then
              echo "FAIL: skills/$skill_name/references/ exists but is empty"
              status=1
            else
              echo "OK: skills/$skill_name/references/ ($file_count files)"
            fi
          done
          exit $status
